{% extends "base.html" %}
{% from "_logo.html" import logo %}
{% block title %}Log in · ClassTracker{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-sm-8 col-md-5 col-lg-4">
    <div class="text-center my-4">
      {{ logo(64, "login-logo") }}
      <h1 class="h3 mt-3 mb-1">Class<span class="ct-gradient-text">Tracker</span></h1>
      <p class="text-body-secondary small mb-0">Meetings, tasks, and exams for every subject, in one calendar.</p>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Log in</h2>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Log in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
