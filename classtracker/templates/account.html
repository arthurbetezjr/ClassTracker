{% extends "base.html" %}
{% block title %}Account settings · ClassTracker{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Account settings</h1>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" value="{{ current_user.username }}" disabled>
          <div class="form-text">Usernames can't be changed.</div>
        </div>
        <h2 class="h6 mt-4">Change password</h2>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label" for="current_password">Current password</label>
            <input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="new_password">New password</label>
            <input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
            <div class="form-text">At least {{ min_length }} characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirm_password">Confirm new password</label>
            <input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
          </div>
          <button class="btn btn-primary" type="submit">Change password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
